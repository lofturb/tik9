name: Construir IPA (iOS 9.3.5 / armv7)

# Se ejecuta al pulsar "Run workflow" o al subir cambios.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos
  APP_DIR: app
  # Toolchain LLVM 11.1.0-L3 de L1ghtmann: el ultimo release estable y el
  # mas usado para compilar armv7 contra SDK 9.3. Es el que expone
  # linux/iphone/bin/clang dentro de $THEOS/toolchain.
  TOOLCHAIN_TAG: test-210562a
  TOOLCHAIN_ASSET: iOSToolchain-x86_64.tar.xz

permissions:
  contents: write

jobs:
  build-ipa:
    # Ubuntu 22.04 (glibc 2.35) es lo que mejor encaja con el toolchain de
    # 2023 y ademas todavia tiene libtinfo5, que algunos binarios necesitan.
    # Los repositorios publicos tienen minutos ilimitados y gratis.
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip unzip git \
            libxml2 xz-utils libz3-dev libtinfo6
          sudo apt-get install -y libtinfo5 || echo "libtinfo5 no disponible (no es critico)"
          sudo update-alternatives --set fakeroot /usr/bin/fakeroot-sysv || true

      - name: Cachear Theos (toolchain + SDK)
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-${{ runner.os }}-${{ env.TOOLCHAIN_TAG }}-sdk9.3-v2

      - name: Instalar Theos + toolchain LLVM (compatible con armv7)
        run: |
          set -euo pipefail
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
            mkdir -p "$THEOS/toolchain" "$THEOS/sdks"
            curl -fL --retry 3 -o /tmp/iOSToolchain.tar.xz \
              "https://github.com/L1ghtmann/llvm-project/releases/download/${TOOLCHAIN_TAG}/${TOOLCHAIN_ASSET}"
            tar -xJf /tmp/iOSToolchain.tar.xz -C "$THEOS/toolchain/"
            rm -f /tmp/iOSToolchain.tar.xz
          fi
          echo "--- estructura del toolchain ---"
          ls -d "$THEOS/toolchain/"*/iphone 2>/dev/null || true
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

      - name: Instalar SDK de iOS 9.3
        run: |
          set -euo pipefail
          if [ ! -d "$THEOS/sdks/iPhoneOS9.3.sdk" ]; then
            mkdir -p "$THEOS/sdks"
            git clone --depth 1 --filter=blob:none --sparse \
              https://github.com/theos/sdks.git /tmp/theos-sdks
            git -C /tmp/theos-sdks sparse-checkout set iPhoneOS9.3.sdk
            cp -a /tmp/theos-sdks/iPhoneOS9.3.sdk "$THEOS/sdks/"
            rm -rf /tmp/theos-sdks
          fi
          ls -d "$THEOS/sdks/"*.sdk

      # El SDK 9.3 trae dos huecos que se tapan copiando el .tbd equivalente del
      # SDK 10.3 (mismo "install-name", mismos simbolos):
      #
      #   1. libSystem.B.tbd re-exporta /usr/lib/system/liblaunch.dylib, pero ese
      #      .tbd nunca se genero (incidencia theos/sdks#10). Sin el, el enlazador
      #      falla con "ld: file not found: /usr/lib/system/liblaunch.dylib".
      #
      #   2. libsystem_c.tbd no declara los simbolos de memoria (_memcpy, _memset,
      #      _memmove, _bzero): solo trae los internos "__platform_mem*" y los
      #      "___memcpy_chk".  Cualquier codigo C que use memcpy/memset (como el
      #      firmador TTSignaCore.c) falla al enlazar con
      #      "Undefined symbols: _memcpy / _memset".  El .tbd del 10.3 si los trae.
      - name: Parchear los .tbd que faltan en el SDK 9.3
        run: |
          set -euo pipefail
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          REF="https://raw.githubusercontent.com/theos/sdks/master/iPhoneOS10.3.sdk"

          LAUNCH="$SDK/usr/lib/system/liblaunch.tbd"
          if [ ! -s "$LAUNCH" ]; then
            curl -fsSL --retry 3 -o "$LAUNCH" "$REF/usr/lib/system/liblaunch.tbd"
            echo "copiado: liblaunch.tbd"
          fi

          MEMORIA="$SDK/usr/lib/system/libsystem_c.tbd"
          if [ -f "$MEMORIA" ] && ! grep -qE '[^A-Za-z0-9_]_memcpy[^A-Za-z0-9_]' "$MEMORIA"; then
            curl -fsSL --retry 3 -o "$MEMORIA" "$REF/usr/lib/system/libsystem_c.tbd"
            echo "copiado: libsystem_c.tbd (faltaban _memcpy/_memset)"
          fi

          echo "--- liblaunch.tbd ---"
          head -n 4 "$LAUNCH"
          echo "--- libsystem_c.tbd: simbolos de memoria declarados ---"
          grep -oE '[^A-Za-z0-9_]_(memcpy|memset|memmove|bzero)[^A-Za-z0-9_]' "$MEMORIA" | sort -u

      - name: Generar iconos e imagenes de arranque
        run: |
          set -euo pipefail
          python3 tools/generar_recursos.py
          ls -la "$APP_DIR/Resources/" | head -n 25

      # El .deb es el camino de instalacion mas firme en un aparato con
      # jailbreak: dpkg copia la app a /Applications y el postinst refresca
      # LaunchServices.  Se compila ANTES que el .ipa porque "make clean" (que
      # va en el paso siguiente) vacia packages/.
      - name: Compilar tambien el paquete .deb
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          make package FINALPACKAGE=1 PACKAGE_FORMAT=deb
          mkdir -p /tmp/deb
          cp packages/*.deb /tmp/deb/
          ls -la /tmp/deb

      - name: Compilar la app y empaquetar el .ipa
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          make clean || true
          make package FINALPACKAGE=1 PACKAGE_FORMAT=ipa

      - name: Recuperar el .deb para publicarlo junto al .ipa
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          cp /tmp/deb/*.deb packages/
          ls -la packages/

      - name: Verificar que el binario es armv7 para iOS 9
        run: |
          set -euo pipefail
          BIN=$(find "$GITHUB_WORKSPACE/$APP_DIR/.theos" -type f -name 'Tik9' | head -n 1)
          if [ -z "$BIN" ]; then echo "No se encontro el binario Tik9"; exit 1; fi
          echo "Binario: $BIN"
          file "$BIN"
          "$THEOS/toolchain/linux/iphone/bin/otool" -hv "$BIN" || true
          echo "--- contenido del paquete ---"
          ls -la "$GITHUB_WORKSPACE/$APP_DIR/packages/"

      - name: Comprobar la estructura del IPA
        run: |
          set -euo pipefail
          IPA=$(ls "$GITHUB_WORKSPACE/$APP_DIR/packages/"*.ipa | head -n 1)
          echo "IPA: $IPA"
          unzip -l "$IPA" | head -n 40
          unzip -l "$IPA" | grep -q 'Payload/Tik9.app/Tik9' \
            || { echo "El IPA no contiene el ejecutable esperado"; exit 1; }
          unzip -l "$IPA" | grep -q 'Payload/Tik9.app/Info.plist' \
            || { echo "El IPA no contiene Info.plist"; exit 1; }

      - name: Publicar el IPA como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Tik9-ipa-armv7
          path: |
            ${{ env.APP_DIR }}/packages/*.ipa
            ${{ env.APP_DIR }}/packages/*.deb
          if-no-files-found: error
          retention-days: 90

      # Los artefactos exigen tener sesion iniciada en GitHub. Publicarlo
      # tambien como Release permite descargarlo desde cualquier navegador,
      # incluso desde el propio iPhone/iPad.
      - name: Publicar tambien como Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ETIQUETA="build-$(date -u +%Y%m%d-%H%M%S)"
          # Las notas van en un fichero del repositorio para que el Release se
          # entienda sin abrir siquiera el README: que es, que trae esta
          # version, como se instala y los avisos legales. --latest deja este
          # Release como el mas visible de la pagina.
          gh release create "$ETIQUETA" ${APP_DIR}/packages/*.ipa ${APP_DIR}/packages/*.deb \
            --title "Tik9 para iOS 9.3.5 (32 bits) — $ETIQUETA" \
            --notes-file .github/notas-release.md \
            --latest \
            || echo "No se pudo crear el Release (el IPA sigue en Artefactos)"
